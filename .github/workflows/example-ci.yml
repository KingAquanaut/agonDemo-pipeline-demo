name: Demo Deploy Pipeline

on:
  push:
    branches: [ "demo/pipeline" ]
  workflow_dispatch:

jobs:
  initial:
    name: 1) Initial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo snapshot
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          ls -la

  build:
    name: 2) Build
    runs-on: ubuntu-latest
    needs: initial
    steps:
      - uses: actions/checkout@v4
      - name: Build placeholder
        run: |
          echo "Build step (api/web) would run here"
          echo "✅ Build complete"

  test:
    name: 3) Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Test placeholder
        run: |
          echo "Unit/integration tests would run here"
          echo "✅ Tests passed"

  sanity:
    name: 4) Sanity Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Sanity placeholder
        run: |
          echo "Smoke checks / quick validation would run here"
          echo "✅ Sanity checks passed"

  deploy_beta:
    name: 5) Deploy (Beta)
    runs-on: ubuntu-latest
    needs: sanity
    environment: beta
    steps:
      - name: Deploy beta placeholder
        run: |
          echo "Deploy to BETA would run here"
          echo "✅ Beta deploy complete"

  deploy_prod:
    name: 6) Deploy (Main/Prod)
    runs-on: ubuntu-latest
    needs: deploy_beta
    environment: production
    steps:
      - name: Deploy prod placeholder
        run: |
          echo "Deploy to PROD would run here"
          echo "✅ Production deploy complete"